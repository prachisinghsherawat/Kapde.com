<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#c81e5a" />
    <meta
      name="description"
      content="Kapde — a modern fashion store for tops, kurtas, denims, frocks, jackets and midis."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Kapde — Fashion Store</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('kapde:ui') || '{}');
          if (stored.theme === 'dark') document.documentElement.classList.add('dark');
        } catch {
          /* first visit, or storage blocked — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
